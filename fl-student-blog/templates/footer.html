      <script>
        const menuButton = document.getElementById("menuToggle");
        const sidebarElement = document.getElementById("sidebarMenu");

        if (menuButton && sidebarElement) {
            const sidebar = bootstrap.Offcanvas.getOrCreateInstance(sidebarElement);
            const desktopBreakpoint = window.matchMedia("(min-width: 992px)");

            function setInitialSidebarState() {
            if (desktopBreakpoint.matches) {
                sidebar.show();
                document.body.classList.add("sidebar-open");
            } else {
                sidebar.hide();
                document.body.classList.remove("sidebar-open");
            }
            }

            menuButton.addEventListener("click", function () {
            sidebar.toggle();
            });

            sidebarElement.addEventListener("shown.bs.offcanvas", function () {
            document.body.classList.add("sidebar-open");
            });

            sidebarElement.addEventListener("hidden.bs.offcanvas", function () {
            document.body.classList.remove("sidebar-open");
            });

            setInitialSidebarState();

            desktopBreakpoint.addEventListener("change", setInitialSidebarState);
            }
            
            document.addEventListener("click", function (event) {
            const isDesktop = desktopBreakpoint.matches;
            const sidebarIsOpen = sidebarElement.classList.contains("show");
            const clickedInsideSidebar = sidebarElement.contains(event.target);
            const clickedMenuButton = menuButton.contains(event.target);

            if (
                !isDesktop &&
                sidebarIsOpen &&
                !clickedInsideSidebar &&
                !clickedMenuButton
            ) {
                sidebar.hide();
            }
            });
        </script>
